<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本信用卡優惠 2026 Q4</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ee;
    --pink: #f5b8c8;
    --pink-dark: #e8849a;
    --mint: #b8e8d8;
    --mint-dark: #5abf9a;
    --yellow: #fce97a;
    --lavender: #d4c8f0;
    --brown: #7a4f3a;
    --text: #3d2b1f;
    --muted: #a07060;
    --border: #ead8c8;
    --surface: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, #e8d5c4 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }

  /* ── Header ── */
  .header { text-align: center; padding: 20px 0 18px; }
  .header h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 22px; font-weight: 900; color: var(--brown);
  }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ── Filter ── */
  .filter-bar {
    display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 8px;
  }
  .filter-btn {
    padding: 6px 14px; border-radius: 99px;
    font-size: 12px; font-weight: 700;
    border: 1.5px solid var(--border); background: white;
    color: var(--text); cursor: pointer;
    white-space: nowrap; transition: all 0.15s;
    flex-shrink: 0;
  }
  .filter-btn:hover { border-color: var(--pink-dark); }
  .filter-btn.active { background: var(--pink-dark); color: white; border-color: var(--pink-dark); }

  /* ── Card ── */
  .card-list { display: flex; flex-direction: column; gap: 12px; }

  .card-item {
    background: var(--surface);
    border-radius: 16px;
    padding: 14px;
    border: 2px solid var(--border);
    box-shadow: 0 2px 8px rgba(100,60,40,0.06);
    cursor: pointer; transition: all 0.15s;
  }
  .card-item:hover { border-color: var(--pink-dark); transform: translateY(-2px); }

  .card-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }

  .card-rank {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--pink); color: white;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 900; font-size: 14px;
    flex-shrink: 0;
  }

  .card-name {
    flex: 1;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px; font-weight: 900; color: var(--brown);
  }

  .card-badge {
    display: inline-block;
    font-size: 9px; font-weight: 700;
    padding: 3px 8px; border-radius: 6px;
    background: var(--yellow); color: #7a6020;
    white-space: nowrap;
  }

  .card-issuer { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .card-rewards {
    font-size: 12px; line-height: 1.6;
    margin: 10px 0;
    padding: 10px;
    background: #f5ede4; border-radius: 8px;
    border-left: 3px solid var(--pink);
  }

  .reward-title { font-weight: 700; color: var(--brown); margin-bottom: 4px; }
  .reward-detail { color: var(--text); font-size: 11px; }

  .card-usage {
    font-size: 11px; color: var(--text);
    padding: 8px; background: #f0fff8; border-radius: 8px;
    border-left: 3px solid var(--mint);
  }

  .usage-label { font-weight: 700; color: var(--mint-dark); }

  .card-verdict {
    margin-top: 10px; padding: 8px;
    background: #fffbee; border-radius: 8px;
    border-left: 3px solid var(--yellow);
    font-size: 11px; color: #7a6020; line-height: 1.6;
  }

  /* ── 警示標籤 ── */
  .card-warning {
    margin-top: 8px; padding: 6px 8px;
    background: #fff0f0; border-radius: 8px;
    border-left: 3px solid #e87070;
    font-size: 10px; color: #a03030; line-height: 1.5;
  }

  /* ── Tips ── */
  .tips-card {
    background: #fef3c7; border: 2px solid var(--yellow);
    border-radius: 12px; padding: 12px 14px;
    margin-bottom: 16px;
  }
  .tips-title { font-family: 'Zen Maru Gothic', sans-serif; font-size: 12px; font-weight: 900; color: #7a6020; margin-bottom: 6px; }
  .tips-text { font-size: 11px; color: #7a6020; line-height: 1.6; }

  /* ── 時效警告 ── */
  .alert-card {
    background: #fff5f5; border: 2px solid #f5b8b8;
    border-radius: 12px; padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 11px; color: #a04040; line-height: 1.6;
  }

  /* ── Empty ── */
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 32px 0; }
  .empty-icon { font-size: 36px; margin-bottom: 8px; }

  /* ── Scrollbar ── */
  .filter-bar::-webkit-scrollbar { height: 4px; }
  .filter-bar::-webkit-scrollbar-track { background: transparent; }
  .filter-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>💳 台灣信用卡優惠</h1>
    <div class="header-sub">2026 Q4（10～12月）・日本旅遊刷卡攻略・11/18 更新</div>
  </div>

  <!-- 時效警告 -->
  <div class="alert-card">
    ⚠️ <strong>多數卡的加碼活動都到 2026/12/31</strong>，明年起會改版。本頁整理自各銀行公告與比較網站，刷卡前請再到官網確認。
  </div>

  <!-- Tips -->
  <div class="tips-card">
    <div class="tips-title">💡 Q4 日本刷卡注意事項</div>
    <div class="tips-text">
      • 富邦 J 卡：Q4 最後一次登錄是 12/18 16:00，限量<br>
      • 玉山熊本熊：2026 年要重新登錄一次，指定店才有 8.5%<br>
      • 中信 uniopen：8% 加碼每月 500 點，約刷 NT$6,250 就滿<br>
      • 刷卡時選「日圓」計價，不要選台幣（DCC 會多收匯差）<br>
      • 外幣手續費約 1.5%，回饋低於此的卡等於白刷
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterCards('all', event)">全部</button>
    <button class="filter-btn" onclick="filterCards('nomind', event)">無腦刷</button>
    <button class="filter-btn" onclick="filterCards('travel', event)">日本旅遊</button>
    <button class="filter-btn" onclick="filterCards('pay', event)">支付優惠</button>
    <button class="filter-btn" onclick="filterCards('nofee', event)">免手續費</button>
  </div>

  <!-- Cards List -->
  <div class="card-list" id="cardList"></div>

</div>

<script>
  const cardsData = [
    {
      rank: 1,
      name: '中信 uniopen 聯名卡',
      issuer: '中國信託銀行',
      baseReward: '最高11%',
      rewards: '• 國外實體消費 3% 無上限（國外線上只有 2%）\n• 國外實體再加碼 8%（每月上限 500 OPENPOINT）\n• 合計最高 11%，免登錄、免領券、不限國家\n• 活動期至 2026/12/31',
      usage: '日本實體店先刷這張，刷到約 NT$6,250 加碼就滿了',
      verdict: '🌟 免登錄最省事，Q4 仍是實體消費首選；超過上限後還有 3%',
      warning: '⚠️ 回饋是 OPENPOINT 不是現金；網購、歐盟交易不適用加碼',
      tags: ['nomind', 'travel']
    },
    {
      rank: 2,
      name: '富邦 J 卡',
      issuer: '台北富邦銀行',
      baseReward: '最高6%',
      rewards: '• 日韓泰一般消費 3% 無上限（需富邦帳戶自扣或電子帳單）\n• 日本實體單筆滿 NT$1,000 加碼 3%（每季上限 1,000 元）\n• Apple Pay 儲值 Suica/PASMO/ICOCA 單筆滿 NT$2,000，合計最高 10%（加碼每季上限 200 元）\n• Q4 登錄：10/18、11/18、12/18 16:00 開放，限量，每季登錄一次即可\n• 活動期至 2026/12/31',
      usage: '大額實體消費、電車卡儲值',
      verdict: '🚃 交通卡 10% 獨強；記得 12/18 是 Q4 最後一次登錄',
      warning: '⚠️ 沒登錄只有 3%；加碼要單筆滿 NT$1,000，小額只有 3%',
      tags: ['travel', 'pay']
    },
    {
      rank: 3,
      name: '玉山熊本熊卡',
      issuer: '玉山銀行',
      baseReward: '最高8.5%',
      rewards: '• 日本一般消費 2.5% 無上限（當期帳單折抵）\n• 指定日本商店加碼 6%（每期上限 500 元），活動期間登錄一次即可\n• 指定商店例：Bic Camera、Yodobashi、松本清、唐吉訶德、大國藥妝、UNIQLO、GU、無印良品、JR、東橫INN、Times 租車、Suica/PASMO/ICOCA 儲值\n• 活動期至 2026/12/31',
      usage: '去指定連鎖店、訂東橫INN、租車時拿出來刷',
      verdict: '🐻 指定店 8.5% 很高，名單幾乎涵蓋旅客常去的連鎖店',
      warning: '⚠️ 一般卡仍收 1.5% 國外交易服務費（日圓雙幣卡免收）；2026 年活動要重新登錄',
      tags: ['travel']
    },
    {
      rank: 4,
      name: '聯邦吉鶴卡',
      issuer: '聯邦銀行',
      baseReward: '最高11%',
      rewards: '• 日圓請款一般消費 2.5% 無上限\n• Apple Pay／Google Pay 日本實體感應加碼最高 2.5%\n• 日本 11 大熱門商店加碼 3%（活動期間上限 600 元）\n• 新戶日本實體加碼 3%（活動期間上限 600 元）\n• Suica/ICOCA/PASMO 儲值 1.5%（每月 15 日 10:00 登錄，限量）\n• 活動期至 2026/12/31',
      usage: 'iPhone / Android 感應付款，日幣消費穩定 2.5% 起跳',
      verdict: '🍀 基本 2.5% 無上限，加碼要綁手機支付',
      warning: '⚠️ 2026 年加碼只限 Apple Pay／Google Pay，QUICPay 沒有加碼；收 1.5% 海外手續費',
      tags: ['nomind', 'travel', 'pay']
    },
    {
      rank: 5,
      name: '台新 Richart 卡',
      issuer: '台新銀行',
      baseReward: '3.3%~3.8%',
      rewards: '• 切換「玩旅刷」：海外消費最高 3.3%（Level 2 需台新帳戶自扣卡費）\n• 切換「Pay著刷」：日本用台新Pay 最高 3.8%，且免 1.5% 國外交易服務費\n• 上限為永久額度＋30 萬，一般人等於無上限\n• 回饋為台新 Point，活動期至 2027/3/31',
      usage: '大額消費、刷爆其他卡上限後的主力',
      verdict: '🌍 不用算上限的無腦卡；用台新Pay 還省手續費',
      warning: '⚠️ 每天只能切一種方案，切 Pay著刷時刷實體卡不算；沒切方案只有 0.3%',
      tags: ['nomind', 'travel', 'pay', 'nofee']
    },
    {
      rank: 6,
      name: '永豐幣倍卡',
      issuer: '永豐銀行',
      baseReward: '最高6%',
      rewards: '• 國外一般消費 2% 無上限（回饋外幣）\n• 精選通路（含國外實體、旅遊通路）加碼 4%（每期上限 800 元）\n• 加碼條件：永豐臺外幣帳戶自扣＋電子／行動帳單＋大戶或資產門檻\n• 新申辦綁 Apple Pay／Google Pay 再加 2%（每月上限 200 元）\n• 活動期至 2026/12/31',
      usage: '有永豐帳戶、會先換日幣的人',
      verdict: '💹 外幣回饋省匯差，條件達標後 6% 很穩',
      warning: '⚠️ 2026 下半年資產門檻調高（多數來源寫月均 30 萬），出發前確認自己符不符合',
      tags: ['travel']
    },
    {
      rank: 7,
      name: '滙豐現金回饋御璽卡',
      issuer: '滙豐銀行',
      baseReward: '2.22%',
      rewards: '• 日本及其他海外一般消費 2.22% 現金回饋無上限\n• 免登錄、免切換、無指定通路\n• 活動期 2026/10/1～12/31',
      usage: '什麼都不想管時的備用卡',
      verdict: '📌 最簡單的無腦卡，扣掉 1.5% 手續費後仍有賺',
      warning: '⚠️ 回饋率不高，主要當其他卡刷滿上限後的備用',
      tags: ['nomind']
    },
    {
      rank: 8,
      name: '樂天 Panda J 卡',
      issuer: '台灣樂天信用卡',
      baseReward: '最高4%',
      rewards: '• 海外消費 1.5% 無上限\n• 日韓泰當地幣別加碼 2.5%，合計最高 4%\n• 免登錄、免切換\n• 活動期至 2026/12/31',
      usage: '小額消費、補位用',
      verdict: '🐼 無門檻好用，但上限偏低',
      warning: '⚠️ 加碼上限各來源寫法不一（每期 300 或 500 元），以樂天官網為準',
      tags: ['nomind']
    }
  ];

  let currentFilter = 'all';

  function filterCards(tag, event) {
    currentFilter = tag;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.remove('active');
    });
    if (event && event.target) {
      event.target.classList.add('active');
    }
    renderCards();
  }

  function renderCards() {
    const container = document.getElementById('cardList');
    let filtered = cardsData;

    if (currentFilter !== 'all') {
      filtered = cardsData.filter(card => card.tags.includes(currentFilter));
    }

    if (!filtered.length) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>沒有符合的信用卡</div>';
      return;
    }

    container.innerHTML = filtered.map(card => `
      <div class="card-item">
        <div class="card-header">
          <div class="card-rank">#${card.rank}</div>
          <div style="flex:1;min-width:0;">
            <div class="card-name">${card.name}</div>
            <div class="card-issuer">${card.issuer}</div>
          </div>
          <div class="card-badge">${card.baseReward}回饋</div>
        </div>

        <div class="card-rewards">
          <div class="reward-title">💎 回饋詳情</div>
          <div class="reward-detail">${card.rewards.split('\n').join('<br>')}</div>
        </div>

        <div class="card-usage">
          <span class="usage-label">📌 使用情境：</span><br>
          ${card.usage}
        </div>

        <div class="card-verdict">
          ${card.verdict}
        </div>

        ${card.warning ? `<div class="card-warning">${card.warning}</div>` : ''}
      </div>
    `).join('');
  }

  // Init
  renderCards();
</script>
</body>
</html>
